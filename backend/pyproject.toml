[project]
name = "filmroll-api"
version = "0.1.0"
description = "Filmroll event camera API"
requires-python = ">=3.13"

# Loose lower bounds here; uv.lock pins the exact resolved versions.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "pyjwt>=2.10",
    "pillow>=11.0",
    # Pure Python, no dependencies, emits SVG. Keeps join URLs off third-party
    # servers and scales cleanly for printed table cards.
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "testcontainers[postgres,redis,minio]>=4.9",
    "time-machine>=2.16",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-boto3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run. The SQLAlchemy engine is created once and
# shared, and asyncpg connections cannot outlive the loop they were opened on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: pure logic, no external services",
    "integration: real Postgres, Redis and MinIO via testcontainers",
    "concurrency: races around caps and idempotency",
    "worker: Celery task behaviour",
    "load: wedding-scale burst, excluded from push gates",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Migration bodies are generated by Alembic; reformatting them creates churn
# and makes the diff against a regenerated file harder to read.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "testcontainers.*"]
ignore_missing_imports = true

# Celery ships no type stubs, so every @task decorator reads as untyped and
# would otherwise mark each task function untyped in strict mode.
[[tool.mypy.overrides]]
module = ["app.worker.tasks"]
disallow_untyped_decorators = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
